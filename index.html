<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈랩 배포 성공!</title>
    <style>
        body { 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #282c34; 
            color: white; 
            margin: 0; 
        }
        .container { 
            text-align: center; 
            padding: 2rem; 
            background: #20232a; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }
        h1 { color: #61dafb; }
        p { font-size: 1.2rem; margin-top: 10px; }
        .stamp {
            display: inline-block;
            margin-top: 20px;
            padding: 5px 15px;
            background: #4caf50;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Hello JongWoon!</h1>
        <p>Mac Mini 홈랩에서 Jenkins가 자동 배포했습니다.</p>
        <div class="stamp">Build Success</div>
    </div>
</body>
</html>
